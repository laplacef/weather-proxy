<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./css/style.css"> <!-- Include CSS file for styling -->
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Weather App</h1> <!-- Display the app title -->
        </header>
        <main>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Enter city name..."> <!-- Input field for city name -->
                <button id="search-button">Search</button> <!-- Button to trigger the search -->
            </div>
            <div class="weather-display">
                <div id="weather-info"></div> <!-- Placeholder for displaying weather information -->
            </div>
        </main>
    </div>
    <script src="./js/script.js"></script> <!-- Include JavaScript file for app logic -->
</body>

</html>
